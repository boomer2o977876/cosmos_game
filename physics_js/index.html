<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Escape Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер макета -->
    <div class="app-container">
        
        <!-- Боковое меню (Sidebar) -->
        <aside class="sidebar">
            <h1 class="logo">ASTEROID<br>ESCAPE</h1>
            
            <nav class="nav-menu">
                <button class="nav-btn active" data-target="menu-screen">🏠 Главное меню</button>
                <button class="nav-btn" data-target="hangar-screen">🛠 Космический Ангар</button>
                <button class="nav-btn" data-target="scores-screen">🏆 Таблица полетов</button>
            </nav>

            <!-- Блок выбора корабля (появляется только в меню) -->
            <div class="ship-selector-panel" id="sidebar-ship-selector">
                <label>Выберите корабль:</label>
                <select id="ship-selector">
                    <option value="">Стандартный корабль</option>
                </select>
            </div>
        </aside>

        <!-- Основная рабочая область -->
        <main class="main-content">
            
            <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
            <section id="menu-screen" class="screen active">
                <h2>Готов к вылету?</h2>
                <p style="color: #aaa; margin-bottom: 30px;">Выберите корабль в левом меню и нажмите старт.</p>
                <button class="btn-primary" id="btn-start">НАЧАТЬ ПОЛЕТ</button>
            </section>

            <!-- ЭКРАН 2: ИГРА -->
            <section id="game-screen" class="screen">
                <!-- HUD (Интерфейс поверх игры) -->
                <div class="hud">
                    <div class="hud-item">
                        <span class="hud-label">Прочность корпуса</span>
                        <div class="progress-container">
                            <div class="progress-bar" id="hp-bar"></div>
                        </div>
                        <span class="hud-value" id="hp-text">100/100</span>
                    </div>
                    <div class="hud-item" style="align-items: flex-end;">
                        <span class="hud-label">Счет: <span id="score-text" style="color:#fff; font-size:18px;">0</span></span>
                        <span class="hud-label" style="margin-top:5px;">Скорость: <span id="speed-text" style="color:#4af;">0.00</span></span>
                    </div>
                </div>
                
                <canvas id="gameCanvas" width="900" height="800"></canvas>
                
                <div id="pause-overlay" class="overlay" style="display:none;">
                    <h2>ПАУЗА</h2>
                    <p>Нажмите ESC для продолжения</p>
                </div>
            </section>

            <!-- ЭКРАН 3: ТАБЛИЦА РЕКОРДОВ -->
            <section id="scores-screen" class="screen">
                <h2>Таблица полетов</h2>
                <table class="scores-table">
                    <thead>
                        <tr><th>#</th><th>Время</th><th>Корабль</th><th>Дата</th></tr>
                    </thead>
                    <tbody id="scores-body"></tbody>
                </table>
            </section>

            <!-- ЭКРАН 4: АНГАР (ЛР 6) -->
            <section id="hangar-screen" class="screen">
                <div class="hangar-layout">
                    <!-- Форма -->
                    <div class="hangar-form">
                        <h3 id="form-title">Новый корабль</h3>
                        <form id="ship-form">
                            <input type="hidden" id="ship-id">
                            <div class="input-group">
                                <label>Название</label>
                                <input type="text" id="ship-name" required placeholder="X-Wing">
                            </div>
                            <div class="input-group">
                                <label>Масса (т)</label>
                                <input type="number" id="ship-mass" required min="1" value="100">
                            </div>
                            <div class="input-group">
                                <label>Сила тяги (кН)</label>
                                <input type="number" id="ship-thrust" required min="1" value="500">
                            </div>
                            <div class="input-group">
                                <label>Прочность корпуса</label>
                                <input type="number" id="ship-durability" required min="1" value="100">
                            </div>
                            <button type="submit" class="btn-primary" style="width:100%;" id="submit-btn">Создать</button>
                            <button type="button" class="btn-secondary" style="width:100%; display:none;" id="cancel-btn">Отмена</button>
                        </form>
                    </div>
                    <!-- Список -->
                    <div class="hangar-list">
                        <input type="text" id="search-input" placeholder="🔍 Поиск...">
                        <div class="ships-grid" id="ships-container"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script type="module" src="game.js"></script>
    <script src="hangar.js"></script>
</body>
</html>
